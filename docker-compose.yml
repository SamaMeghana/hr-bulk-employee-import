version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: hr-bulk-import-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hrdb
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: hr-bulk-import-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
